<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk | ATTENDLY</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body class="kiosk-page">
  <div class="container kiosk-container py-4">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center gap-2">
        <a class="role-brand" href="ssc-dashboard.html"><i class="bi bi-fingerprint"></i><span>ATTENDLY</span></a>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="kiosk-status"><i class="bi bi-circle-fill" style="font-size:.5rem"></i> Kiosk active</span>
        <button class="icon-button" type="button" aria-label="Toggle theme" data-theme-toggle><i class="bi bi-moon" data-theme-icon></i></button>
      </div>
    </div>

    <div class="row g-4">
      <!-- Scan Panel -->
      <div class="col-lg-7">
        <div class="card kiosk-card">
          <div class="card-body p-4">
            <h2 class="h5 mb-3"><i class="bi bi-upc-scan me-2"></i>Scan student ID</h2>
            <p class="text-muted mb-3" style="font-size:.82rem">Enter or scan the student's ID number to record attendance.</p>

            <div class="mb-3">
              <label for="kioskEvent" class="form-label fw-semibold" style="font-size:.78rem">Select event</label>
              <select id="kioskEvent" class="form-select"></select>
            </div>

            <form id="kioskScanForm">
              <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="studentIdInput" class="form-control" placeholder="Enter student ID or email" autocomplete="off" required>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i> Record</button>
              </div>
            </form>

            <div class="d-flex align-items-center gap-3 mt-3">
              <div>
                <small class="text-muted">Checked in</small>
                <strong class="d-block" id="kioskCount" style="font-size:1.4rem">0</strong>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Result Panel -->
      <div class="col-lg-5">
        <div class="card kiosk-result">
          <div id="scanResult">
            <div class="card-body d-flex flex-column justify-content-center align-items-center text-center p-4">
              <i class="bi bi-fingerprint kiosk-icon"></i>
              <h2 class="h4 mt-3">Ready to scan</h2>
              <p class="text-muted mb-0">Scan a student ID or enter it manually to begin.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="position-fixed top-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/kiosk.js"></script>
</body>
</html>
